name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Check repository contents
        run: python tools/check_repository.py
      - name: Check Python syntax
        run: python -m compileall -q tools

  windows:
    name: Compile Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64
      - name: Compile game and diagnostic probes
        run: cmake --build build/windows --config Release --parallel --target DeadWarrior2 tutorial_probe archidon_probe magic_probe rebels_probe giants_probe audio_probe
      # Gameplay probes run locally after preparing the user's own assets.
      # CI does not fetch or publish original game resources.
