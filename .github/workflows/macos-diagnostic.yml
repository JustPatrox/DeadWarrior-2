name: macOS startup diagnosis

on:
  workflow_dispatch:
    inputs:
      assets_tag:
        description: Release containing prepared Windows assets
        required: true
        default: v0.0.0-preview.15

permissions:
  contents: read

jobs:
  startup:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Fetch prepared assets
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS_TAG: ${{ inputs.assets_tag }}
        run: |
          gh release download "$ASSETS_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'DeadWarrior-2-Windows-x64.zip' --dir work
          python tools/package_release.py assets --archive work/DeadWarrior-2-Windows-x64.zip
      - name: Build installed app
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build/native --parallel 3 --target DeadWarrior2
          cmake --install build/native --prefix out/package
      - name: Capture native startup
        env:
          SDL_AUDIO_DRIVER: dummy
        run: python tools/run_macos_smoke.py 'out/package/DeadWarrior 2.app/Contents/MacOS/DeadWarrior 2'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macOS-startup-diagnosis
          path: |
            out/checks/*
            out/test-save/lastest.log
            out/smoke-output.log
            out/smoke-stacks.log
          if-no-files-found: warn
