name: Reportar un fallo
description: Un problema de juego, gráficos, audio, entrada o compilación.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Gracias por probar DeadWarrior 2. No adjuntes el SWF ni recursos extraídos. Revisa los logs por si contienen rutas personales."
  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: Por ejemplo, el hash de git rev-parse --short HEAD
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Entorno
      description: Windows, GPU, resolución, modo de pantalla, límite de FPS y V-Sync.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrir...\n2. Pulsar...\n3. Observar..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado actual
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log y capturas
      description: Arrastra lastest.log aquí. Se reemplaza al iniciar el juego; guarda una copia antes de abrirlo otra vez.
