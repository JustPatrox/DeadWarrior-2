name: Bug report
description: Report a gameplay, graphics, audio, input, or build problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for testing DeadWarrior 2. Do not attach the SWF or extracted resources. Review logs for personal paths before posting."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: For example, the output of git rev-parse --short HEAD
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Environment
      description: Windows version, GPU, resolution, display mode, FPS limit, and V-Sync setting.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Click...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log and screenshots
      description: Drag lastest.log here. It is replaced on launch, so save a copy before opening the game again.
